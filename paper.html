<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水槽</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#26394a;cursor:none}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

/* ===== 基本 ===== */
var TAU = Math.PI * 2;
var qs = new URLSearchParams(location.search);
var SPEED = parseFloat(qs.get('speed'));
if (!(SPEED > 0) || !isFinite(SPEED)) SPEED = 1;
SPEED = Math.min(SPEED, 300);
var MAXLONG = 1920;          // 内部描画の長辺上限
var STEP = 1 / 30;           // シミュレーションの最大刻み
var MAXSTEPS = 600;

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha: false });
var W = 1, H = 1, U = 1, surfY = 0, floorY = 0, D = 1;

var rand = Math.random;
function rr(a, b) { return a + (b - a) * rand(); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function wrap(p) { return (p >= TAU || p < 0) ? ((p % TAU) + TAU) % TAU : p; }
function seeded(s) {
  return function () {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    var t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ===== 色 ===== */
function hx(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mx(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function css(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }

// 基本の 12 色（くすんだ中間色）。他はこの中どうしの混色。
var BASE = {
  ink: '#26394a', deep: '#2f5d62', teal: '#3f7f7a', sea: '#5e9c8f',
  sage: '#93b4a2', sand: '#d8c59f', sandD: '#b39b72', cream: '#eee2c6',
  coral: '#d9826b', rust: '#a5573f', mustard: '#d4a64a', slate: '#5a6e72'
};
var PAL = {}, pid = 0;
function addC(name, rgb) { PAL[name] = { id: pid++, rgb: rgb }; }
for (var k in BASE) addC(k, hx(BASE[k]));
function R(k) { return PAL[k].rgb; }
addC('coralL', mx(R('coral'), R('cream'), 0.45));
addC('mustL', mx(R('mustard'), R('cream'), 0.45));
addC('sandL', mx(R('sand'), R('cream'), 0.5));
addC('sandM', mx(R('sand'), R('sandD'), 0.5));
addC('seaD', mx(R('sea'), R('deep'), 0.55));
addC('slateL', mx(R('slate'), R('sage'), 0.55));
addC('olive', mx(R('mustard'), R('deep'), 0.55));
addC('wood', mx(mx(R('rust'), R('sandD'), 0.45), R('ink'), 0.35));
addC('woodL', mx(R('rust'), R('sandD'), 0.6));
addC('spot', mx(R('sandD'), R('ink'), 0.65));
addC('stone', mx(R('sandD'), R('slate'), 0.5));
addC('stoneL', mx(R('sand'), R('slate'), 0.3));
addC('creamD', mx(R('cream'), R('sandD'), 0.35));
addC('corySk', mx(R('slate'), R('sandD'), 0.35));
addC('coryBk', mx(R('ink'), R('slate'), 0.4));

// 時刻のキー（周期 20 分。0 と 1 は同じ値）
function key(o) { var r = {}; for (var k in o) r[k] = typeof o[k] === 'string' ? hx(o[k]) : o[k]; return r; }
var K_DAY   = key({ top: '#a3c8be', bot: '#4f8682', fog: '#7aa9a1', tint: '#ffffff', ta: 0.0,  ray: '#f5efda', ra: 0.15, shade: '#1f3942' });
var K_DUSK  = key({ top: '#edbb93', bot: '#b07379', fog: '#cf977f', tint: '#ea8a5f', ta: 0.2, ray: '#fbdcb0', ra: 0.18, shade: '#4a2c38' });
var K_NIGHT = key({ top: '#34516a', bot: '#17263a', fog: '#2a4058', tint: '#1a2c4e', ta: 0.48, ray: '#a7c0d4', ra: 0.06, shade: '#0d1726' });
var K_DAWN  = key({ top: '#a0b6bf', bot: '#3f5e6e', fog: '#7690a0', tint: '#a2b5d6', ta: 0.12, ray: '#ebe8dc', ra: 0.10, shade: '#1b2f3e' });
var KEYS = [[0, K_DAY], [0.2, K_DAY], [0.32, K_DUSK], [0.46, K_DUSK], [0.58, K_NIGHT], [0.76, K_NIGHT], [0.88, K_DAWN], [1, K_DAY]];
var CYCLE = 1200; // 秒
var dayPh = 0;    // 0..1 で折り返し
var env = {};
function computeEnv() {
  var i = 0;
  while (i < KEYS.length - 2 && dayPh >= KEYS[i + 1][0]) i++;
  var a = KEYS[i], b = KEYS[i + 1];
  var t = (dayPh - a[0]) / Math.max(1e-6, b[0] - a[0]);
  t = clamp(t, 0, 1); t = t * t * (3 - 2 * t);
  for (var k in a[1]) {
    var va = a[1][k], vb = b[1][k];
    env[k] = typeof va === 'number' ? va + (vb - va) * t : mx(va, vb, t);
  }
  env.fog = mx(env.top, env.bot, WT[3]); // 奥の物は、その高さの水の色へ溶ける
  env.farC = css(mx(mx(env.top, env.bot, WT[3] + 0.08), env.shade, 0.2));
  env.farH = css(mx(mx(env.top, env.bot, WT[3]), env.shade, 0.1));
}
var WB = [0, 0.27, 0.5, 0.72];          // 水の段の上端（水面〜砂の割合）
var WT = [0.22, 0.32, 0.42, 0.52];       // 各段の色（上の色→下の色の割合）
var cache = new Map();
function C(name, fog, shade) {
  var p = PAL[name];
  shade = shade || 0;
  var key = p.id * 1000000 + Math.round(fog * 200) * 1000 + Math.round(shade * 200);
  var s = cache.get(key);
  if (s) return s;
  var c = mx(p.rgb, env.tint, env.ta);
  c = mx(c, env.fog, fog);
  if (shade) c = mx(c, env.shade, shade);
  s = css(c); cache.set(key, s); return s;
}

/* ===== 層 ===== */
var LAYERS = [
  { fog: 0.56, shade: 0, f: 0.075, amp: 14 },  // 0 遠景の岩
  { fog: 0.44, shade: 0, f: 0.085, amp: 16 },  // 1 奥の水草
  { fog: 0.10, shade: 0, f: 0.105, amp: 20 },  // 2 中景
  { fog: 0.00, shade: 0.34, f: 0.13, amp: 24 } // 3 手前
];

/* ===== 砂の形 ===== */
function sandY(x) { var u = x / W; return floorY + Math.sin(u * TAU * 1.1 + 0.7) * 12 * U + Math.sin(u * TAU * 2.7 + 2.1) * 6 * U; }
function backY(x) { var u = x / W; return floorY - 30 * U + Math.sin(u * TAU * 1.6 + 1.3) * 14 * U + Math.sin(u * TAU * 3.4 + 0.4) * 6 * U; }
function lipY(x) { var u = x / W; return H - 34 * U + Math.sin(u * TAU * 2.2 + 0.3) * 9 * U + Math.sin(u * TAU * 5.1 + 1.7) * 4 * U; }

/* ===== 汎用パス ===== */
function smoothArr(a, n) { // a: 平坦配列, n: 要素数(座標数*2)
  var m = n / 2;
  ctx.moveTo(a[0], a[1]);
  for (var i = 1; i < m - 1; i++) {
    var x = a[2 * i], y = a[2 * i + 1];
    ctx.quadraticCurveTo(x, y, (x + a[2 * i + 2]) / 2, (y + a[2 * i + 3]) / 2);
  }
  ctx.lineTo(a[2 * m - 2], a[2 * m - 1]);
}
function closedSmooth(pts) {
  var p = new Path2D(), n = pts.length / 2;
  function mxp(i) { return (pts[2 * (i % n)] + pts[2 * ((i + 1) % n)]) / 2; }
  function myp(i) { return (pts[2 * (i % n) + 1] + pts[2 * ((i + 1) % n) + 1]) / 2; }
  p.moveTo(mxp(0), myp(0));
  for (var i = 1; i <= n; i++) p.quadraticCurveTo(pts[2 * (i % n)], pts[2 * (i % n) + 1], mxp(i), myp(i));
  p.closePath();
  return p;
}
function blobPts(rng, rx, ry, n, jit) {
  var pts = [];
  for (var i = 0; i < n; i++) {
    var a = i / n * TAU, r = 1 + (rng() * 2 - 1) * jit;
    var x = Math.cos(a) * rx * r, y = -ry + Math.sin(a) * ry * r;
    if (y > ry * 0.12) y = ry * 0.12;
    pts.push(x, y);
  }
  return pts;
}
function leafPath(x0, y0, cx, cy, x1, y1, w) {
  var dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1;
  var nx = -dy / l * w, ny = dx / l * w;
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(cx + nx, cy + ny, x1, y1);
  ctx.quadraticCurveTo(cx - nx, cy - ny, x0, y0);
}

/* ===== レイアウト ===== */
var farRocks = [], plants = [[], [], [], []], midRocks = [], frontRocks = [], woods = [], pebbles = [], ripples = [];
var emitters = [], rays = [];
var woodPath = null, woodHi = null, woodShadow = null;

function makeRock(rng, x, rx, ry, layer, c, ch, moss) {
  var pts = blobPts(rng, rx, ry, 9, 0.14);
  var hp = [];
  for (var i = 0; i < pts.length; i += 2) hp.push(pts[i] * 0.8 - rx * 0.16, pts[i + 1] * 0.78 - ry * 0.3);
  var r = { x: x, rx: rx, ry: ry, layer: layer, c: c, ch: ch, path: closedSmooth(pts), hi: closedSmooth(hp), moss: null };
  if (moss) {
    var mp = [];
    for (var j = 0; j < 7; j++) {
      var a = j / 7 * TAU, rad = 1 + (rng() * 2 - 1) * 0.25;
      mp.push(Math.cos(a) * rx * 0.45 * rad + rx * 0.1, -ry * 2 + Math.sin(a) * ry * 0.35 * rad);
    }
    r.moss = closedSmooth(mp);
  }
  return r;
}

function strip(path, x0, y0, cx, cy, x1, y1, w0, w1) {
  var n = 22, Lp = [], Rp = [];
  for (var i = 0; i <= n; i++) {
    var t = i / n, it = 1 - t;
    var x = it * it * x0 + 2 * it * t * cx + t * t * x1;
    var y = it * it * y0 + 2 * it * t * cy + t * t * y1;
    var dx = 2 * it * (cx - x0) + 2 * t * (x1 - cx), dy = 2 * it * (cy - y0) + 2 * t * (y1 - cy);
    var l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
    var w = (w0 + (w1 - w0) * t) / 2;
    Lp.push(x + nx * w, y + ny * w); Rp.push(x - nx * w, y - ny * w);
  }
  path.moveTo(Lp[0], Lp[1]);
  for (var a = 2; a < Lp.length; a += 2) path.lineTo(Lp[a], Lp[a + 1]);
  var ex = (Lp[Lp.length - 2] + Rp[Rp.length - 2]) / 2, ey = (Lp[Lp.length - 1] + Rp[Rp.length - 1]) / 2;
  var tx = x1 - cx, ty = y1 - cy, tl = Math.hypot(tx, ty) || 1;
  path.quadraticCurveTo(ex + tx / tl * w1 * 0.7, ey + ty / tl * w1 * 0.7, Rp[Rp.length - 2], Rp[Rp.length - 1]);
  for (var b = Rp.length - 4; b >= 0; b -= 2) path.lineTo(Rp[b], Rp[b + 1]);
  path.closePath();
}
function quadPt(x0, y0, cx, cy, x1, y1, t) {
  var it = 1 - t;
  return [it * it * x0 + 2 * it * t * cx + t * t * x1, it * it * y0 + 2 * it * t * cy + t * t * y1];
}

function bladeGroup(rng, layer, x, n, hMin, hMax, w, cols, spread) {
  var items = [];
  for (var i = 0; i < n; i++) {
    items.push({ dx: (rng() * 2 - 1) * spread * U, h: hMin + rng() * (hMax - hMin), w: w * (0.8 + rng() * 0.4) * U,
      lean: (rng() * 2 - 1) * 0.22, po: rng() * TAU, c: cols[i % cols.length] });
  }
  items.sort(function (a, b) { return b.h - a.h; });
  return { t: 'b', layer: layer, x: x, items: items, ph: rng() * TAU, f: LAYERS[layer].f * (0.9 + rng() * 0.2), amp: LAYERS[layer].amp };
}
function stemGroup(rng, layer, x, n, hMin, hMax, stemC, leafCs, leafLen, spread) {
  var items = [];
  for (var i = 0; i < n; i++) {
    var h = hMin + rng() * (hMax - hMin);
    items.push({ dx: (rng() * 2 - 1) * spread * U, h: h, lean: (rng() * 2 - 1) * 0.12, po: rng() * TAU,
      nodes: Math.max(4, Math.round(h / (34 * U))), ll: leafLen * (0.85 + rng() * 0.3) * U });
  }
  return { t: 's', layer: layer, x: x, items: items, sc: stemC, lc: leafCs, ph: rng() * TAU, f: LAYERS[layer].f * (0.9 + rng() * 0.2), amp: LAYERS[layer].amp * 0.7 };
}
function swordGroup(rng, layer, x, y, n, lMin, lMax, wr, cols, vein, aMin, aMax) {
  var items = [];
  for (var i = 0; i < n; i++) {
    var a = aMin + (aMax - aMin) * (n === 1 ? 0.5 : i / (n - 1)) + (rng() * 2 - 1) * 0.08;
    var l = (lMin + rng() * (lMax - lMin)) * U * (1 - Math.abs(a) * 0.25);
    items.push({ a: a, l: l, w: l * wr, po: rng() * TAU, c: cols[i % cols.length] });
  }
  items.sort(function (p, q) { return Math.abs(q.a) - Math.abs(p.a); });
  return { t: 'w', layer: layer, x: x, y: y, items: items, vein: vein, ph: rng() * TAU, f: LAYERS[layer].f * (0.9 + rng() * 0.2), amp: LAYERS[layer].amp };
}

function build() {
  var rng = seeded(20261125);
  var sW = clamp(W / (1920 * U), 0.6, 1.4);
  farRocks = []; plants = [[], [], [], []]; midRocks = []; frontRocks = []; pebbles = []; ripples = []; emitters = []; rays = [];

  // 遠景の岩影
  [[0.04, 250, 150], [0.3, 300, 110], [0.57, 230, 170], [0.86, 320, 130], [1.02, 200, 100]].forEach(function (d) {
    farRocks.push(makeRock(rng, d[0] * W, d[1] * U * sW, d[2] * U, 0, 'deep', 'teal', false));
  });
  // 奥の水草
  [0.18, 0.49, 0.79].forEach(function (u) {
    plants[1].push(bladeGroup(rng, 1, u * W, 7, D * 0.5, D * 0.82, 15, ['sea', 'teal'], 40));
  });
  [0.03, 0.63, 0.95].forEach(function (u) {
    plants[1].push(stemGroup(rng, 1, u * W, 4, D * 0.35, D * 0.6, 'teal', ['sage', 'sea'], 30, 30));
  });
  // 中景
  plants[2].push(bladeGroup(rng, 2, 0.075 * W, 9, D * 0.42, D * 0.7, 17, ['sea', 'seaD'], 46));
  plants[2].push(swordGroup(rng, 2, 0.665 * W, 0, 8, 170, 250, 0.26, ['sea', 'teal'], 'sage', -1.15, 1.15));
  plants[2].push(stemGroup(rng, 2, 0.875 * W, 5, D * 0.32, D * 0.55, 'rust', ['coral', 'coralL'], 34, 42));
  plants[2].push(stemGroup(rng, 2, 0.43 * W, 3, D * 0.22, D * 0.36, 'olive', ['olive', 'sage'], 30, 22));
  plants[2].push(swordGroup(rng, 2, 0.53 * W, 0, 6, 80, 120, 0.3, ['olive', 'sea'], 'mustL', -1.2, 1.2));

  // 中景の岩
  midRocks.push(makeRock(rng, 0.62 * W, 120 * U, 78 * U, 2, 'stone', 'stoneL', true));
  midRocks.push(makeRock(rng, 0.705 * W, 85 * U, 112 * U, 2, 'slate', 'slateL', false));
  midRocks.push(makeRock(rng, 0.765 * W, 64 * U, 42 * U, 2, 'stone', 'stoneL', false));
  midRocks.push(makeRock(rng, 0.25 * W, 46 * U, 28 * U, 2, 'slate', 'slateL', false));

  // 流木
  woodPath = new Path2D(); woodHi = new Path2D(); woodShadow = new Path2D();
  var x0 = 0.1 * W, y0 = sandY(0.1 * W) + 14 * U;
  var tc = [0.22 * W, floorY - 46 * U], te = [0.37 * W, floorY - D * 0.27];
  strip(woodPath, x0, y0, tc[0], tc[1], te[0], te[1], 84 * U, 30 * U);
  strip(woodShadow, x0, y0, tc[0], tc[1], te[0], te[1], 84 * U, 30 * U);
  var b1 = quadPt(x0, y0, tc[0], tc[1], te[0], te[1], 0.45);
  var b1e = [0.155 * W, floorY - D * 0.37], b1c = [b1[0] - 0.008 * W, b1[1] - D * 0.13];
  strip(woodPath, b1[0], b1[1], b1c[0], b1c[1], b1e[0], b1e[1], 38 * U, 10 * U);
  strip(woodShadow, b1[0], b1[1], b1c[0], b1c[1], b1e[0], b1e[1], 38 * U, 10 * U);
  var b2 = quadPt(x0, y0, tc[0], tc[1], te[0], te[1], 0.78);
  strip(woodPath, b2[0], b2[1], b2[0] + 0.05 * W, b2[1] - D * 0.05, 0.455 * W, floorY - D * 0.37, 26 * U, 8 * U);
  strip(woodPath, x0 + 10 * U, y0 - 6 * U, x0 - 0.03 * W, y0 - 26 * U, x0 - 0.065 * W, y0 + 4 * U, 52 * U, 14 * U);
  strip(woodPath, x0 + 30 * U, y0, x0 + 0.03 * W, y0 + 4 * U, x0 + 0.06 * W, y0 + 26 * U, 34 * U, 10 * U);
  strip(woodHi, x0 + 8 * U, y0 - 24 * U, tc[0], tc[1] - 22 * U, te[0] - 4 * U, te[1] - 8 * U, 22 * U, 8 * U);
  strip(woodHi, b1[0] - 8 * U, b1[1] - 10 * U, b1c[0] - 8 * U, b1c[1], b1e[0] - 3 * U, b1e[1], 10 * U, 3 * U);
  strip(woodHi, x0 - 4 * U, y0 - 22 * U, x0 - 0.03 * W, y0 - 38 * U, x0 - 0.06 * W, y0 - 6 * U, 14 * U, 4 * U);

  // 砂のもよう
  for (var i = 0; i < 46; i++) {
    var px = rng() * W, py = sandY(px) + 10 * U + rng() * (H - sandY(px) - 50 * U);
    var cols = ['sandD', 'stone', 'stoneL', 'creamD', 'slate', 'sandM'];
    pebbles.push({ x: px, y: py, rx: (4 + rng() * 9) * U, ry: (3 + rng() * 5) * U, c: cols[(rng() * cols.length) | 0], a: (rng() - 0.5) * 0.6 });
  }
  for (var j = 0; j < 14; j++) {
    var qx = rng() * W, qy = sandY(qx) + 16 * U + rng() * (H - sandY(qx) - 60 * U);
    ripples.push({ x: qx, y: qy, w: (40 + rng() * 90) * U, h: (2 + rng() * 2.5) * U });
  }

  // 手前
  plants[3].push(swordGroup(rng, 3, -0.01 * W, H + 30 * U, 7, 300, 400, 0.24, ['deep', 'seaD'], 'teal', -0.15, 1.25));
  plants[3].push(bladeGroup(rng, 3, 0.885 * W, 7, D * 0.26, D * 0.44, 19, ['seaD', 'deep'], 40));
  frontRocks.push(makeRock(rng, 0.985 * W, 170 * U, 100 * U, 3, 'slate', 'slateL', true));
  frontRocks.push(makeRock(rng, 0.905 * W, 70 * U, 42 * U, 3, 'stone', 'stoneL', false));

  // 泡の出どころ
  emitters.push({ x: 0.585 * W, active: true, t: rr(6, 12), sp: 0 });
  emitters.push({ x: 0.465 * W, active: false, t: rr(8, 20), sp: 0 });

  // 光の筋
  [-0.08, 0.14, 0.34, 0.55, 0.76].forEach(function (u) {
    rays.push({ u: u + (rng() - 0.5) * 0.05, w: (45 + rng() * 70) * U, ph: rng() * TAU, f: 0.02 + rng() * 0.02, ph2: rng() * TAU, f2: 0.03 + rng() * 0.03 });
  });
}

/* ===== 魚 ===== */
var bA = 0, bP = 0, bK = 0;
function by(x, y) {
  var s = 0.5 - x, s2 = s > 0.12 ? s - 0.12 : 0;
  return y + bA * s2 * s2 * Math.sin(bP - bK * s);
}
function M(x, y) { ctx.moveTo(x, by(x, y)); }
function L(x, y) { ctx.lineTo(x, by(x, y)); }
function Q(cx, cy, x, y) { ctx.quadraticCurveTo(cx, by(cx, cy), x, by(x, y)); }
function B(a, b, c, d, x, y) { ctx.bezierCurveTo(a, by(a, b), c, by(c, d), x, by(x, y)); }
function E(x, y, r) { var yy = by(x, y); ctx.moveTo(x + r, yy); ctx.arc(x, yy, r, 0, TAU); }
function fillP(col, fn) { ctx.fillStyle = col; ctx.beginPath(); fn(); ctx.fill(); }
function clipDraw(fn, inner) { ctx.save(); ctx.beginPath(); fn(); ctx.clip(); inner(); ctx.restore(); }

var SP = {};
// 細長い小魚（群れ）

  ctx.globalAlpha = 1;
}
function drawSurface() {
  var stp = 30 * U, x;
  function wy(x) { var u = x / W; return surfY + Math.sin(u * TAU * 3 + sph) * 5 * U + Math.sin(u * TAU * 7 - sph2) * 2.5 * U; }
  ctx.fillStyle = css(mx(env.ray, env.top, 0.55));
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.moveTo(-2, -2);
  for (x = -2; x < W + stp; x += stp) ctx.lineTo(Math.min(x, W + 2), wy(Math.min(x, W + 2)) + 4 * U);
  ctx.lineTo(W + 2, -2); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = css(mx(env.ray, env.top, 0.4));
  ctx.beginPath(); ctx.moveTo(-2, -2);
  for (x = -2; x < W + stp; x += stp) ctx.lineTo(Math.min(x, W + 2), wy(Math.min(x, W + 2)));
  ctx.lineTo(W + 2, -2); ctx.closePath(); ctx.fill();
}

// 紙の粒子（起動時に一度だけ作るタイル）
var grain = (function () {
  var g = document.createElement('canvas'); g.width = g.height = 160;
  var gx = g.getContext('2d'), id = gx.createImageData(160, 160), d = id.data;
  for (var i = 0; i < d.length; i += 4) {
    var v = rand();
    if (v < 0.5) { d[i] = d[i + 1] = d[i + 2] = 20; d[i + 3] = rand() * 34; }
    else { d[i] = d[i + 1] = d[i + 2] = 250; d[i + 3] = rand() * 26; }
  }
  gx.putImageData(id, 0, 0);
  return ctx.createPattern(g, 'repeat');
})();

function draw() {
  cache.clear();
  computeEnv();
  var i;
  drawWater();
  for (i = 0; i < farRocks.length; i++) drawRock(farRocks[i], LAYERS[0].fog, 0, 0);
  for (i = 0; i < plants[1].length; i++) drawPlant(plants[1][i], LAYERS[1].fog, 0);
  drawRays();
  drawParts(false);
  drawSand();
  var fog2 = LAYERS[2].fog;
  for (i = 0; i < plants[2].length; i++) drawPlant(plants[2][i], fog2, 0);
  drawWood(fog2);
  for (i = 0; i < midRocks.length; i++) drawRock(midRocks[i], fog2, 0, 0.16);
  drawBubbles();
  for (i = 0; i < fishes.length; i++) drawFish(fishes[i]);
  drawParts(true);
  fillCurve(lipY, H + 2, C('sandM', 0, 0.22));
  for (i = 0; i < plants[3].length; i++) drawPlant(plants[3][i], 0, LAYERS[3].shade);
  for (i = 0; i < frontRocks.length; i++) drawRock(frontRocks[i], 0, LAYERS[3].shade, 0);
  drawSurface();
  ctx.fillStyle = grain; ctx.globalAlpha = 0.55; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
}

/* ===== 大きさ ===== */
var started = false;
function resize() {
  var cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = cw * dpr, h = ch * dpr, s = Math.min(1, MAXLONG / Math.max(w, h));
  w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
  var oW = W;
  if (started && w === W && h === H) return;
  cv.width = w; cv.height = h; W = w; H = h;
  U = Math.min(W, H) / 1080;
  surfY = clamp(H * 0.035, 22 * U, 60 * U);
  floorY = H - clamp(H * 0.17, 130 * U, 250 * U);
  D = floorY - surfY;
  setSizes();
  build();
  if (!started) {
    initFish();
    for (var i = 0; i < PART_N; i++) resetPart(parts[i], true);
    started = true;
  } else {
    var k = W / oW, all = fishes.concat([leader]);
    for (var j = 0; j < all.length; j++) all[j].x *= k;
    placeAll();
    for (var q = 0; q < PART_N; q++) resetPart(parts[q], true);
    for (var b = 0; b < BUB_MAX; b++) bubbles[b].alive = false;
  }
}
window.addEventListener('resize', resize);
resize();

/* ===== ループ ===== */
var last = -1;
function frame(now) {
  var dt = last < 0 ? 0 : (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  var sim = dt * SPEED;
  if (sim > 0) {
    var n = Math.min(MAXSTEPS, Math.max(1, Math.ceil(sim / STEP)));
    var h = sim / n;
    for (var i = 0; i < n; i++) step(h);
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__stats = function () {
  var bub = 0, vis = 0, away = 0;
  for (var i = 0; i < BUB_MAX; i++) if (bubbles[i].alive) bub++;
  for (var j = 0; j < fishes.length; j++) {
    var f = fishes[j], gone = f.key === 'tetra' ? leader.away : f.away;
    if (gone) away++; else if (f.x > -pxLen(f) * 0.6 && f.x < W + pxLen(f) * 0.6) vis++;
  }
  return { fish: fishes.length, fishOnScreen: vis, fishAway: away, bubbles: bub, bubbleMax: BUB_MAX, particles: parts.length, cycle: +dayPh.toFixed(4), size: [W, H] };
};
})();
</script>
