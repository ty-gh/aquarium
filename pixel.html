<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aquarium</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1a26;
    cursor: none;
  }
  canvas {
    position: absolute;
    display: block;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------
  // 設定
  // ------------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  let SPEED = parseFloat(params.get('speed'));
  if (!isFinite(SPEED) || SPEED <= 0) SPEED = 1;
  SPEED = Math.min(SPEED, 1000);

  const TAU = Math.PI * 2;
  const DAY_PERIOD = 1200;      // 色味の一周（秒）= 20 分
  const MAX_DT = 0.1;           // 1 フレームの実時間の上限（秒）
  const SUB_STEP = 1 / 30;      // シミュレーションの刻み（秒）
  const MAX_SUBSTEPS = 1200;
  const MAX_BUBBLES = 72;
  const TARGET_SHORT = 180;     // 内部バッファの短辺の目安（px）
  const MAX_LONG = 720;         // 内部バッファの長辺の上限
  const MAX_AREA = 640 * 400;   // 内部バッファの面積の上限

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  // ------------------------------------------------------------------
  // パレット（32 色）
  // ------------------------------------------------------------------
  const BASE_HEX = [
    '#0b1a26', '#10283a', '#143a4a', '#1a4d58', '#236068', '#2f7676', '#4a9488', '#8cc4a8', // 0-7 水
    '#d8eccc',                                                                         // 8 ハイライト
    '#3a3530', '#6b5a44', '#9c8160', '#c8a97c',                                        // 9-12 砂
    '#1e2a30', '#3c4a4e', '#5e6c68', '#8a9086',                                        // 13-16 岩
    '#12352c', '#1f5a3a', '#3f8a46', '#86b85a',                                        // 17-20 水草
    '#3b2418', '#6a4128',                                                              // 21-22 流木
    '#a8402c', '#e07a3c', '#f2b25c', '#f4e2b8',                                        // 23-26 暖色
    '#3ab8d8', '#7a5c8a', '#b7c4c8', '#2a2030', '#e85a6a'                              // 27-31 魚
  ];
  const BASE = BASE_HEX.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const NCOL = BASE.length;

  // 色味の移ろいでどれだけ染めるか（暖色の差し色と縁取りは少し控えめに）
  const TINT_W = new Float32Array(NCOL).fill(1);
  [23, 24, 25, 26, 31, 27].forEach(i => { TINT_W[i] = 0.72; });
  TINT_W[30] = 0.6;

  // 明るく／暗くするときの置き換え表
  const LIGHTEN = [1, 2, 3, 4, 5, 6, 7, 8, 8, 10, 11, 12, 26, 14, 15, 16, 8, 18, 19, 20, 26, 22, 10, 24, 25, 26, 8, 8, 29, 8, 13, 24];
  const DARKEN  = [0, 0, 1, 2, 3, 4, 5, 6, 7, 21, 9, 10, 11, 0, 13, 14, 15, 1, 17, 18, 19, 30, 21, 21, 23, 24, 25, 4, 30, 16, 0, 23];

  // 時刻のキーフレーム（p は 0..1 の位相）
  const KEYS = [
    { p: 0.00, mul: [0.96, 1.00, 1.02], add: [0, 4, 8],   shaft: 0.50, caus: 0.55 }, // 昼
    { p: 0.22, mul: [0.96, 1.00, 1.02], add: [0, 4, 8],   shaft: 0.50, caus: 0.55 },
    { p: 0.40, mul: [1.08, 0.82, 0.78], add: [24, 2, 8],  shaft: 0.40, caus: 0.32 }, // 夕方
    { p: 0.58, mul: [0.48, 0.58, 0.80], add: [0, 2, 10],  shaft: 0.16, caus: 0.08 }, // 夜
    { p: 0.80, mul: [0.48, 0.58, 0.80], add: [0, 2, 10],  shaft: 0.16, caus: 0.08 },
    { p: 0.92, mul: [0.86, 0.84, 0.94], add: [12, 6, 10], shaft: 0.34, caus: 0.30 }, // 明け方
    { p: 1.00, mul: [0.96, 1.00, 1.02], add: [0, 4, 8],   shaft: 0.50, caus: 0.55 }
  ];

  const pal32 = new Uint32Array(NCOL);
  const light = { shaft: 0.5, caus: 0.5 };
  const littleEndian = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;

  function smooth(t) { return t * t * (3 - 2 * t); }

  function updatePalette(phase) {
    let a = KEYS[0], b = KEYS[KEYS.length - 1];
    for (let i = 0; i < KEYS.length - 1; i++) {
      if (phase >= KEYS[i].p && phase <= KEYS[i + 1].p) { a = KEYS[i]; b = KEYS[i + 1]; break; }
    }
    const span = b.p - a.p;
    const t = span > 0 ? smooth((phase - a.p) / span) : 0;
    const mul = [0, 0, 0], add = [0, 0, 0];
    for (let k = 0; k < 3; k++) {
      mul[k] = a.mul[k] + (b.mul[k] - a.mul[k]) * t;
      add[k] = a.add[k] + (b.add[k] - a.add[k]) * t;
    }
    light.shaft = a.shaft + (b.shaft - a.shaft) * t;
    light.caus = a.caus + (b.caus - a.caus) * t;
    for (let i = 0; i < NCOL; i++) {
      const w = TINT_W[i];
      const c = BASE[i];
      const rgb = [0, 0, 0];
      for (let k = 0; k < 3; k++) {
        const tinted = c[k] * mul[k] + add[k];
        let v = c[k] + (tinted - c[k]) * w;
        v = v < 0 ? 0 : v > 255 ? 255 : v;
        rgb[k] = v | 0;
      }
      pal32[i] = littleEndian
        ? ((255 << 24) | (rgb[2] << 16) | (rgb[1] << 8) | rgb[0]) >>> 0
        : ((rgb[0] << 24) | (rgb[1] << 16) | (rgb[2] << 8) | 255) >>> 0;
    }
  }

  // 8x8 ベイヤー行列（0..1）
  const BAYER = new Float32Array(64);
  (() => {
    const m = [
      0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
      12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
      3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
      15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21
    ];
    for (let i = 0; i < 64; i++) BAYER[i] = (m[i] + 0.5) / 64;
  })();
  function bayer(x, y) { return BAYER[((y & 7) << 3) | (x & 7)]; }

  // ------------------------------------------------------------------
  // 乱数
  // ------------------------------------------------------------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = Math.random;
  function rr(a, b) { return a + (b - a) * rnd(); }
  function wrapPhase(p) { return p >= TAU ? p - TAU * Math.floor(p / TAU) : p; }

  // ------------------------------------------------------------------
  // スプライト（右向きで手打ち。縁取りは自動で付ける）
  // ------------------------------------------------------------------
  const LEGEND = {
    k: 30, e: 0, s: 29, S: 16, w: 26, y: 25, o: 24, r: 23, R: 31, b: 27, p: 28,
    g: 15, G: 14, d: 13, t: 12, n: 11, F: 16, f: 7, l: 26, m: 10
  };

  const SPRITES = {
    // ネオンテトラ風（群れ）
    tetra: {
      soft: 'f',
      tail: 3,
      rows: [
        'f...wsssss...',
        'ff.sbbbbbbbs.',
        '.ffbbbbbbbbes',
        'ff.RRRRRRsss.',
        'f...RRRRsws..'
      ]
    },
    // レッドワグ・プラティ風
    platy: {
      soft: '',
      tail: 3,
      rows: [
        '........kkk......',
        '......kkkkrr.....',
        'kk...rrrrrrrrr...',
        'kkk.ooooooooooor.',
        'kkkkooooooooooeoo',
        'kkk.ooooooooooooy',
        'kk...yyyyyyyyyy..',
        '.......k..k......'
      ]
    },
    // パールグラミー風（長い腹びれの糸）
    gourami: {
      soft: 'l',
      tail: 4,
      rows: [
        '.........ppppp......',
        'p.......ppppppp.....',
        'ppp...ppsswsswssss..',
        'pppppswsswsswsssess.',
        'pppppGGsGGsGGsssoooo',
        'pppppswsswsswsooooo.',
        'ppp...sssssssoooo...',
        '.p...pppsssoool.....',
        '....ppppppppp.......',
        '............l.......',
        '....llllllll........'
      ]
    },
    // エンゼルフィッシュ風（主役）
    angel: {
      soft: 'l',
      tail: 7,
      rows: [
        '........w.............',
        '........Sw............',
        '........SSw...........',
        '........SSSk..........',
        '........SSSkw.........',
        '........SSSkSw........',
        '........SSSkSSw.......',
        '........wwwkwwwk......',
        '.F......wwwkwwwkww....',
        '.FFF....wwwkwwwkyyy...',
        '.FFFF...ssskssskyyRk..',
        '..FFFF.sssskssskyyeky.',
        '...FFFFsssskssskssskss',
        '...FFFFssssksssksssks.',
        '...FFFFssssksssksssks.',
        '..FFFF..sssksssksssk..',
        '.FFFF...sssksssksss...',
        '.FFF....ssskssskss....',
        '.F......sssksssks.....',
        '.........ssksssk......',
        '.......SSSSkSSlk......',
        '.......SSSSkSSl.......',
        '.......SSSSkSwl.......',
        '.......SSSSkwl........',
        '.......SSSSk.l........',
        '.......SSSw..l........',
        '.......SSw..l.........'
      ]
    },
    // コリドラス風（底）
    cory: {
      soft: 'l',
      tail: 3,
      rows: [
        '..........kk......',
        'g.........kkk.....',
        'gg....k..SSSSS....',
        '.gk...SSSSSSSSkk..',
        '..kkSSSSSSSSSkekk.',
        '..kkSSSSSSSSSSkSSS',
        '.gkkwwwwwwwwwwwwSS',
        'gg...wwwwwwwwwww.l',
        'g.......SS..SS.l..'
      ]
    }
  };

  // 文字マップ → 塗り配列（-1 は透明、soft は縁取りを生まない）
  function parseSprite(def) {
    const h = def.rows.length;
    let w = 0;
    def.rows.forEach(r => { if (r.length > w) w = r.length; });
    const fill = new Int16Array(w * h).fill(-1);
    const soft = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      const row = def.rows[y];
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === '.') continue;
        const ci = LEGEND[ch];
        if (ci === undefined) continue;
        fill[y * w + x] = ci;
        if (def.soft.indexOf(ch) >= 0) soft[y * w + x] = 1;
      }
    }
    return { w, h, fill, soft };
  }

  // 尾びれの列をずらしたコマを作り、そのあと縁取りを付ける
  function buildFrames(def, outlineIdx) {
    const base = parseSprite(def);
    const frames = [];
    const offsets = [-1, 0, 1];
    for (const off of offsets) {
      const W = base.w + 2, H = base.h + 4;
      const fill = new Int16Array(W * H).fill(-1);
      const soft = new Uint8Array(W * H);
      for (let y = 0; y < base.h; y++) {
        for (let x = 0; x < base.w; x++) {
          const v = base.fill[y * base.w + x];
          if (v < 0) continue;
          let dy = 0;
          if (x < def.tail) dy = Math.round(off * (def.tail - x) / def.tail);
          const tx = x + 1, ty = y + 2 + dy;
          fill[ty * W + tx] = v;
          soft[ty * W + tx] = base.soft[y * base.w + x];
        }
      }
      const out = new Int16Array(W * H).fill(-1);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (fill[i] >= 0) { out[i] = fill[i]; continue; }
          let edge = false;
          const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
          for (const [dx, dy] of nb) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
            const j = ny * W + nx;
            if (fill[j] >= 0 && !soft[j]) { edge = true; break; }
          }
          if (edge) out[i] = outlineIdx;
        }
      }
      frames.push({ w: W, h: H, data: out });
    }
    return frames;
  }

  const FRAMES = {};
  for (const k in SPRITES) FRAMES[k] = buildFrames(SPRITES[k], 30);
  const TAIL_SEQ = [1, 0, 1, 2];

  // ------------------------------------------------------------------
  // 画面バッファ
  // ------------------------------------------------------------------
  let W = 320, H = 180;
  let buf = new Uint8Array(W * H);          // 毎フレームの色番号
  let stat = new Uint8Array(W * H);         // 背景・砂・岩などの静止層
  let waterMask = new Uint8Array(W * H);    // 1 = 奥の水（奥の草を描いてよい所）
  let vign = new Uint8Array(W * H);         // 周辺減光の段数
  let sandTop = new Int16Array(W);
  let imgData = null, img32 = null;
  let sandBase = 160;

  function px(x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    buf[y * W + x] = c;
  }
  function pxBehind(x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = y * W + x;
    if (waterMask[i]) buf[i] = c;
  }
  function remap(x, y, table) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = y * W + x;
    buf[i] = table[buf[i]];
  }

  function drawSprite(frame, cx, cy, sx) {
    const fw = frame.w, fh = frame.h, d = frame.data;
    const asx = Math.abs(sx);
    const dw = Math.max(1, Math.round(fw * asx));
    const x0 = Math.round(cx - dw / 2);
    const y0 = Math.round(cy - fh / 2);
    for (let i = 0; i < dw; i++) {
      const dx = x0 + i;
      if (dx < 0 || dx >= W) continue;
      let sc = Math.floor((i + 0.5) / dw * fw);
      if (sc >= fw) sc = fw - 1;
      if (sx < 0) sc = fw - 1 - sc;
      for (let j = 0; j < fh; j++) {
        const v = d[j * fw + sc];
        if (v < 0) continue;
        const dy = y0 + j;
        if (dy < 0 || dy >= H) continue;
        buf[dy * W + dx] = v;
      }
    }
  }

  // ------------------------------------------------------------------
  // 景色（リサイズのたびに作り直す）
  // ------------------------------------------------------------------
  let plants = [];
  let farBlades = [];
  let shafts = [];
  let bubbleSources = [];
  let leafClusters = [];

  function waterValue(y) {
    // 上 5.4 → 下 0.7 の段階
    const t = Math.min(1, Math.max(0, y / Math.max(1, sandBase)));
    return 5.4 - t * 4.7;
  }
  function bandIndex(x, y, v) {
    const b = Math.floor(v);
    let f = v - b;
    f = Math.min(1, Math.max(0, (f - 0.3) / 0.4)); // ほとんどは無地の帯、境目だけディザ
    return (f > bayer(x, y) ? b + 1 : b);
  }

  function buildScene() {
    const R = mulberry32(20261125 + W * 7 + H * 13);
    const r = (a, b) => a + (b - a) * R();
    const f = Math.max(0.7, Math.min(1.6, W / 320));
    const sandH = Math.max(16, Math.min(40, Math.round(Math.min(H, W) * 0.12)));
    sandBase = H - sandH;

    // 砂の上端
    const a1 = r(0, TAU), a2 = r(0, TAU);
    for (let x = 0; x < W; x++) {
      sandTop[x] = Math.round(sandBase + 2.2 * Math.sin(x * 0.028 + a1) + 1.4 * Math.sin(x * 0.071 + a2));
    }

    // 背景の水
    for (let y = 0; y < H; y++) {
      const v = waterValue(y);
      for (let x = 0; x < W; x++) {
        stat[y * W + x] = bandIndex(x, y, v);
        waterMask[y * W + x] = 1;
      }
    }

    // 遠くの岩影（背景を 1 段暗く）
    const hp1 = r(0, TAU), hp2 = r(0, TAU);
    for (let x = 0; x < W; x++) {
      const hh = 10 + 9 * Math.sin(x * 0.021 + hp1) + 6 * Math.sin(x * 0.053 + hp2);
      const top = Math.round(sandTop[x] - Math.max(2, hh) * Math.min(1.4, f));
      for (let y = Math.max(0, top); y < sandTop[x]; y++) {
        const i = y * W + x;
        stat[i] = DARKEN[stat[i]];
      }
    }

    // 砂
    for (let x = 0; x < W; x++) {
      for (let y = sandTop[x]; y < H; y++) {
        const i = y * W + x;
        const depth = y - sandTop[x];
        let c;
        if (depth === 0) c = 12;
        else if (depth < 3) c = (bayer(x, y) < 0.5 ? 11 : 12);
        else if (depth < 7) c = 11;
        else if (depth < 11) c = (bayer(x, y) < 0.5 ? 10 : 11);
        else c = 10;
        const n = R();
        if (n < 0.06) c = 10; else if (n < 0.09) c = 12; else if (n < 0.1) c = 9;
        stat[i] = c;
        waterMask[i] = 0;
      }
    }
    // 小石
    const pebbles = Math.round(W / 9);
    for (let k = 0; k < pebbles; k++) {
      const x = Math.floor(r(0, W));
      const y = Math.floor(sandTop[Math.min(W - 1, x)] + r(3, H - sandTop[Math.min(W - 1, x)]));
      const big = R() < 0.4;
      const col = R() < 0.5 ? 15 : 14;
      setStat(x, y, col); setStat(x + 1, y, col);
      if (big) { setStat(x, y - 1, 16); setStat(x + 1, y - 1, col); setStat(x + 2, y, 13); }
      setStat(x, y + 1, 9); setStat(x + 1, y + 1, 9);
    }

    // 岩と流木
    leafClusters = [];
    const rocks = [];
    rocks.push({ cx: W * 0.20, rx: 27 * f, ry: 24 * f });
    rocks.push({ cx: W * 0.20 + 24 * f, rx: 15 * f, ry: 13 * f });
    rocks.push({ cx: W * 0.20 - 25 * f, rx: 11 * f, ry: 8 * f });
    rocks.push({ cx: W * 0.80, rx: 19 * f, ry: 15 * f });
    rocks.push({ cx: W * 0.80 + 17 * f, rx: 10 * f, ry: 7 * f });
    if (W > 420) rocks.push({ cx: W * 0.5, rx: 12 * f, ry: 8 * f });

    // 流木は岩の前後関係のため先に
    drawWood(R, f);
    rocks.forEach(rk => drawRock(R, rk.cx, rk.rx, rk.ry));

    // エアストーン（泡の出どころ）
    bubbleSources = [];
    const sx1 = Math.round(W * 0.62);
    const sy1 = sandTop[sx1];
    for (let dx = -2; dx <= 2; dx++) {
      setStat(sx1 + dx, sy1 - 1, Math.abs(dx) === 2 ? 13 : 14);
      setStat(sx1 + dx, sy1, 13);
    }
    setStat(sx1 - 1, sy1 - 2, 13); setStat(sx1, sy1 - 2, 15); setStat(sx1 + 1, sy1 - 2, 13);
    bubbleSources.push(makeSource(sx1, sy1 - 3, 0.2));
    // 岩の隙間からも
    const sx2 = Math.round(W * 0.20 + 10 * f);
    bubbleSources.push(makeSource(sx2, sandTop[Math.min(W - 1, sx2)] - Math.round(22 * f), 0.08));

    // 周辺減光
    const cx = W / 2, cy = H / 2;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = (x - cx) / cx, dy = (y - cy) / cy;
        const d = Math.sqrt(dx * dx * 0.8 + dy * dy * 0.9);
        const v = Math.max(0, (d - 0.84) * 2.2);
        const lvl = Math.floor(v);
        const frac = v - lvl;
        vign[y * W + x] = Math.min(2, lvl + (frac > bayer(x + 3, y + 5) ? 1 : 0));
      }
    }

    buildPlants(R, f);
    buildOpenSand();
    buildShafts(R);
  }

  function setStat(x, y, c) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    stat[y * W + x] = c;
    waterMask[y * W + x] = 0;
  }

  function drawRock(R, cx, rx, ry) {
    const p1 = R() * TAU, p2 = R() * TAU, p3 = R() * TAU;
    const base = sandTop[Math.max(0, Math.min(W - 1, Math.round(cx)))] + 2;
    const x0 = Math.floor(cx - rx - 3), x1 = Math.ceil(cx + rx + 3);
    const y0 = Math.floor(base - ry - 3);
    const inside = (x, y) => {
      const dx = (x - cx) / rx, dy = (y - base) / ry;
      if (dy > 0.05) return false;
      const ang = Math.atan2(dy, dx);
      const rad = 1 + 0.12 * Math.sin(ang * 3 + p1) + 0.07 * Math.sin(ang * 7 + p2) + 0.05 * Math.sin(ang * 11 + p3);
      return dx * dx + dy * dy < rad * rad;
    };
    for (let y = y0; y <= base; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!inside(x, y)) continue;
        const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1);
        const dx = (x - cx) / rx, dy = (y - base) / ry;
        // 左上からの光
        let s = -dx * 0.55 - dy * 0.9 + 0.15 * Math.sin(x * 0.7 + y * 0.3 + p1) - 0.25;
        let c;
        const v = s * 2.2 + 1.2;
        const b = Math.max(0, Math.min(3, Math.floor(v)));
        const fr = v - Math.floor(v);
        c = 13 + Math.min(3, b + (fr > bayer(x, y) && b < 3 ? 1 : 0));
        if (edge) c = (dy < -0.6 && dx < 0.2) ? 15 : 13;
        // 苔
        if (!edge && dy < -0.55 && R() < 0.5 && Math.sin(x * 0.5 + p2) > -0.2) c = (bayer(x, y) < 0.5 ? 18 : 19);
        // 底の影
        if (y >= base - 1) c = 13;
        setStat(x, y, c);
      }
      // 砂に落ちる影
    }
    for (let x = Math.floor(cx - rx * 1.15); x <= Math.ceil(cx + rx * 1.25); x++) {
      if (x < 0 || x >= W) continue;
      const y = sandTop[x];
      for (let k = 0; k < 2; k++) {
        const i = (y + k) * W + x;
        if (y + k < H && !inside(x, y + k) && stat[i] >= 10 && stat[i] <= 12) stat[i] = (k === 0 ? 10 : (bayer(x, y + k) < 0.5 ? 10 : stat[i]));
      }
    }
  }

  function drawWood(R, f) {
    const bx = W * 0.60, by = sandTop[Math.round(W * 0.60)] + 1;
    const branches = [
      { x0: bx, y0: by, x1: bx + 42 * f, y1: by - Math.min(sandBase * 0.48, 62 * f), t0: 6 * f, t1: 2 },
      { x0: bx + 18 * f, y0: by - 22 * f, x1: bx + 6 * f, y1: by - 48 * f, t0: 3, t1: 1.5 },
      { x0: bx - 2, y0: by, x1: bx - 26 * f, y1: by - 6 * f, t0: 4.5 * f, t1: 2 },
      { x0: bx + 34 * f, y0: by - 48 * f, x1: bx + 52 * f, y1: by - 54 * f, t0: 2, t1: 1 }
    ];
    for (const b of branches) {
      const len = Math.hypot(b.x1 - b.x0, b.y1 - b.y0);
      const steps = Math.ceil(len * 2);
      const nx = -(b.y1 - b.y0) / len, ny = (b.x1 - b.x0) / len;
      const wob = R() * TAU;
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const cxp = b.x0 + (b.x1 - b.x0) * t + Math.sin(t * 5 + wob) * 1.5;
        const cyp = b.y0 + (b.y1 - b.y0) * t;
        const th = b.t0 + (b.t1 - b.t0) * t;
        for (let k = -th; k <= th; k += 0.5) {
          const x = Math.round(cxp + nx * k), y = Math.round(cyp + ny * k);
          const rel = k / th; // -1..1
          let c = 22;
          const lit = ny * rel; // 上側が明るい
          if (Math.abs(rel) > 0.8) c = 21;
          else if (lit < -0.35) c = (bayer(x, y) < 0.5 ? 11 : 22);
          else if (lit > 0.3) c = 21;
          if (((x * 3 + y * 5) % 11) === 0 && Math.abs(rel) < 0.6) c = 21; // 木目
          setStat(x, y, c);
        }
      }
    }
    // 流木に付く葉（アヌビアス風）
    leafClusters.push({ x: bx + 30 * f, y: by - 40 * f, n: 4 });
    leafClusters.push({ x: bx + 10 * f, y: by - 14 * f, n: 3 });
  }

  function makeSource(x, y, bias) {
    return { x, y, on: false, timer: rr(3, 25) + bias * 30, emit: 0, rate: 0.5 };
  }

  // 水草
  function buildPlants(R, f) {
    plants = [];
    farBlades = [];
    const waterH = Math.min(sandBase, 165);   // 縦置きでも草が伸びすぎないように
    const r = (a, b) => a + (b - a) * R();

    // 遠景の草（背景を暗くするだけ）
    const nFar = Math.round(W / 22);
    for (let i = 0; i < nFar; i++) {
      const x = r(0, W);
      farBlades.push({
        x, base: sandTop[Math.min(W - 1, Math.floor(x))] - 4,
        h: r(0.14, 0.32) * waterH, lean: r(-0.15, 0.15), amp: r(2, 4), bend: r(-4, 4),
        ph: R() * TAU, w: r(0.25, 0.45)
      });
    }

    // 奥の帯状の草（岩の後ろ）
    const backSpots = [0.06, 0.15, 0.27, 0.36, 0.72, 0.86, 0.95];
    if (W > 420) backSpots.push(0.46, 0.55);
    for (const s of backSpots) {
      const x = W * s + r(-6, 6);
      const n = Math.round(r(4, 7));
      const blades = [];
      for (let k = 0; k < n; k++) {
        blades.push({
          dx: r(-5, 5), h: r(0.32, 0.64) * waterH, lean: r(-0.18, 0.18),
          amp: r(2.5, 6), ph: R() * TAU, w: r(0.35, 0.6), bend: r(-0.3, 0.3)
        });
      }
      plants.push({ type: 'ribbon', layer: 'back', x, base: sandTop[clampX(x)] + 1, blades, tone: 0 });
    }

    // 中景：茎のある草（岩の手前）
    const stemSpots = [
      { s: 0.31, red: false, n: 4, h: 0.42 },
      { s: 0.40, red: true,  n: 3, h: 0.34 },
      { s: 0.70, red: false, n: 4, h: 0.48 },
      { s: 0.89, red: true,  n: 3, h: 0.30 }
    ];
    for (const sp of stemSpots) {
      const x = W * sp.s + r(-4, 4);
      const stems = [];
      for (let k = 0; k < sp.n; k++) {
        stems.push({ dx: r(-5, 5), h: r(0.7, 1.0) * sp.h * waterH, lean: r(-0.12, 0.12), amp: r(1.5, 3.5), ph: R() * TAU, w: r(0.3, 0.5), leafPh: Math.floor(r(0, 4)) });
      }
      plants.push({ type: 'stem', layer: 'mid', x, base: sandTop[clampX(x)] + 1, stems, red: sp.red });
    }

    // 手前：低い草むら
    const tufts = [0.09, 0.47, 0.56, 0.77];
    for (const s of tufts) {
      const x = W * s + r(-5, 5);
      const n = Math.round(r(5, 8));
      const blades = [];
      for (let k = 0; k < n; k++) {
        blades.push({ dx: r(-6, 6), h: r(6, 16) * Math.min(1.3, f), lean: r(-0.35, 0.35), amp: r(0.8, 1.8), ph: R() * TAU, w: r(0.4, 0.7), bend: 0 });
      }
      plants.push({ type: 'ribbon', layer: 'front', x, base: sandTop[clampX(x)] + 3, blades, tone: 2 });
    }

    // 手前：画面の端を縁取る背の高い草
    const edgeBlades = [];
    for (let k = 0; k < 6; k++) {
      edgeBlades.push({ dx: r(-6, 8), h: r(0.45, 0.85) * waterH, lean: r(0.0, 0.2), amp: r(3, 7), ph: R() * TAU, w: r(0.25, 0.4), bend: r(0, 0.3) });
    }
    plants.push({ type: 'ribbon', layer: 'front', x: W * 0.015, base: sandTop[clampX(W * 0.015)] + 1, blades: edgeBlades, tone: 1 });
    const edgeBlades2 = [];
    for (let k = 0; k < 4; k++) {
      edgeBlades2.push({ dx: r(-6, 4), h: r(0.3, 0.55) * waterH, lean: r(-0.2, 0.0), amp: r(3, 6), ph: R() * TAU, w: r(0.25, 0.4), bend: r(-0.3, 0) });
    }
    plants.push({ type: 'ribbon', layer: 'front', x: W * 0.985, base: sandTop[clampX(W * 0.985)] + 1, blades: edgeBlades2, tone: 1 });
  }

  function clampX(x) { return Math.max(0, Math.min(W - 1, Math.round(x))); }

  function buildShafts(R) {
    shafts = [];
    const n = Math.max(3, Math.round(W / 80));
    for (let i = 0; i < n; i++) {
      shafts.push({
        x: (i + 0.3 + R() * 0.4) / n * W * 1.1 - W * 0.12,
        slope: 0.22 + R() * 0.12,
        w0: 7 + R() * 10,
        ph: R() * TAU, w: 0.05 + R() * 0.05,
        ph2: R() * TAU, w2: 0.03 + R() * 0.04,
        amp: 5 + R() * 6
      });
    }
  }

  // ------------------------------------------------------------------
  // 魚
  // ------------------------------------------------------------------
  const SPECIES = {
    angel:   { frame: 'angel',   n: 2, speed: 4.2, band: [0.20, 0.60], turnRate: 1 / 300, exitP: 0.12 },
    gourami: { frame: 'gourami', n: 2, speed: 5.2, band: [0.10, 0.48], turnRate: 1 / 300, exitP: 0.12 },
    platy:   { frame: 'platy',   n: 4, speed: 7.0, band: [0.15, 0.72], turnRate: 1 / 240, exitP: 0.15 },
    cory:    { frame: 'cory',    n: 3, speed: 4.5, bottom: true,      turnRate: 0,      exitP: 0 },
    tetra:   { frame: 'tetra',   n: 8, speed: 8.0, band: [0.20, 0.60], turnRate: 1 / 240, exitP: 0, school: true }
  };
  const MAX_AWAY = 2;   // 同時に画面外へ出ていてよい魚の数

  // 群れの隊形（進行方向に少し長い、ゆるい 3 列）
  const SCHOOL_SLOTS = [[-30, -9], [-10, -10], [10, -8], [-20, 1], [0, 0], [20, 2], [-12, 10], [8, 9]];

  let fishes = [];
  let school = null;
  let openSand = [];      // 底の魚が休める開けた砂の x

  function fishSize(sp) { const fr = FRAMES[sp.frame][1]; return { w: fr.w, h: fr.h }; }

  function bandY(sp, t) {
    const lo = Math.max(10, sandBase * sp.band[0]);
    const hi = Math.min(sandBase - 12, sandBase * sp.band[1]);
    return lo + (hi - lo) * t;
  }

  function newSwimmer(spKey, x, y, dir) {
    const sp = SPECIES[spKey];
    const sz = fishSize(sp);
    return {
      sp: spKey, x, y, vx: dir * sp.speed, vy: 0, dir, face: dir, sx: dir,
      turning: false, w: sz.w, h: sz.h,
      tailPh: rnd() * 4, sPh: rnd() * TAU, sW: rr(0.05, 0.12),
      yPh1: rnd() * TAU, yW1: rr(0.04, 0.09), yPh2: rnd() * TAU, yW2: rr(0.11, 0.2),
      yHome: rnd(), yHomeT: rr(20, 60),
      xHome: 0.5, xRange: 0.25, swapT: rr(60, 180),
      state: 'swim', awayT: 0, exiting: false,
      speedMul: rr(0.85, 1.15),
      rest: 0, tx: x, region: [0, 1], crossTo: 0, hover: 0, callT: 0, member: false, ox: 0, oy: 0,
      oPh: rnd() * TAU, oW: rr(0.08, 0.18), oPh2: rnd() * TAU, oW2: rr(0.1, 0.22),
      flipHold: 0, turnT: 0
    };
  }

  // 等間隔の枠を少し揺らして並べ替えた位置（0..1）
  function spreadSlots(n) {
    const a = [];
    for (let i = 0; i < n; i++) a.push((i + 0.5 + rr(-0.3, 0.3)) / n);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function soloList() {
    const a = [];
    for (const f of fishes) if (!f.member && !SPECIES[f.sp].bottom) a.push(f);
    return a;
  }

  // 底の魚は砂の手前側（水草や岩の根元より下）を歩く。歩ける x の範囲
  function buildOpenSand() {
    openSand = [];
    for (let x = 14; x < W - 14; x++) openSand.push(x);
  }
  // 底の魚の高さ（体の上端が砂の表面より 4px 下＝根元より手前）
  function coryY(f) {
    return sandTop[clampX(f.x)] + 10;
  }

  function pickCoryTarget(f) {
    const others = fishes.filter(o => o !== f && SPECIES[o.sp].bottom);
    const free = x => others.every(o => Math.abs(o.tx - x) > 24 && Math.abs(o.x - x) > 20);
    const reg = f.region;
    const inRegion = x => x >= reg[0] * W && x <= reg[1] * W;
    let cand = openSand.filter(x => inRegion(x) && free(x));
    if (cand.length === 0) cand = openSand.filter(x => inRegion(x));
    if (cand.length === 0) cand = openSand.slice();
    if (cand.length === 0) return rr(Math.max(20, reg[0] * W), Math.min(W - 20, reg[1] * W));
    const near = cand.filter(x => Math.abs(x - f.x) < 70);
    const pool = (near.length > 0 && rnd() < 0.8) ? near : cand;
    return pool[Math.floor(rnd() * pool.length)];
  }

  function initFish() {
    fishes = [];
    // 泳ぐ魚：それぞれに「よく泳ぐ範囲」を画面全体へ均等に割り振る
    const swimKeys = [];
    for (const key of ['angel', 'gourami', 'platy']) for (let i = 0; i < SPECIES[key].n; i++) swimKeys.push(key);
    const xs = spreadSlots(swimKeys.length);
    const ys = spreadSlots(swimKeys.length);
    swimKeys.forEach((key, i) => {
      const sp = SPECIES[key];
      const f = newSwimmer(key, 0, 0, rnd() < 0.5 ? -1 : 1);
      f.xHome = 0.12 + 0.76 * xs[i];
      f.xRange = rr(0.16, 0.28);
      f.x = W * (f.xHome + rr(-0.6, 0.6) * f.xRange);
      f.x = Math.max(f.w, Math.min(W - f.w, f.x));
      f.yHome = ys[i];
      f.y = bandY(sp, ys[i]);
      fishes.push(f);
    });
    // 底の魚：受け持ちを左半分・右半分に分け（中央線はまたがない）、砂の上から始める
    const regions = rnd() < 0.5 ? [[0.04, 0.45], [0.55, 0.96], [0.04, 0.45]] : [[0.04, 0.45], [0.55, 0.96], [0.55, 0.96]];
    for (let i = 0; i < SPECIES.cory.n; i++) {
      const f = newSwimmer('cory', W * (0.2 + 0.3 * i), 0, rnd() < 0.5 ? -1 : 1);
      f.region = regions[i % regions.length];
      fishes.push(f);
      f.tx = pickCoryTarget(f);
      f.x = f.tx;
      f.y = coryY(f);
      f.rest = rr(2, 10);
      f.vx = 0;
    }
    // 群れ：見えない中心と、それを追うメンバー
    const sp = SPECIES.tetra;
    const dir = rnd() < 0.5 ? -1 : 1;
    // 群れは左右どちらかの側に住み、数分おきに反対側へ移る
    school = newSwimmer('tetra', 0, bandY(sp, rr(0.3, 0.7)), dir);
    school.w = 80; school.h = 26;
    school.xHome = rnd() < 0.5 ? 0.3 : 0.7; school.xRange = 0.14;
    school.x = W * school.xHome;
    school.sideT = rr(90, 200);
    for (let i = 0; i < sp.n; i++) {
      const m = newSwimmer('tetra', 0, 0, dir);
      m.member = true;
      m.ox = SCHOOL_SLOTS[i][0] + rr(-3, 3);
      m.oy = SCHOOL_SLOTS[i][1] + rr(-1.5, 1.5);
      m.x = school.x + m.ox; m.y = school.y + m.oy;
      fishes.push(m);
    }
    // 開いた直後から左右どちらかに寄りすぎないように並べ直す
    for (let k = 0; k < 8; k++) {
      const c = sideCounts();
      const total = c.left + c.right;
      const crowd = c.left > Math.floor(total * 0.6) ? -1 : c.right > Math.floor(total * 0.6) ? 1 : 0;
      if (crowd === 0) break;
      const cands = soloList().filter(f => (f.x < W / 2 ? -1 : 1) === crowd);
      if (cands.length === 0) break;
      const f = cands[Math.floor(rnd() * cands.length)];
      f.x = W - f.x; f.xHome = 1 - f.xHome;
    }
  }

  function offscreen(f) {
    return (f.x - f.w / 2 > W + 1) || (f.x + f.w / 2 < -1);
  }

  function awayCount() {
    let n = 0;
    for (const f of fishes) if (!f.member && (f.state === 'away' || f.exiting)) n++;
    return n;
  }

  function startTurn(f) {
    f.dir = -f.dir;
    f.turning = true;
    f.crossTo = 0;
    f.hover = 0;
  }

  // ある側の「混み具合」を控えめ（多め）に数える：渡っている途中の魚は両側に数える
  function sideLoad(side, othersOnly) {
    let n = 0, total = 0;
    for (const f of fishes) {
      if (f.state === 'away' || offscreen(f)) continue;
      if (!f.exiting) total++;           // 画面外へ向かっている魚は、もういないものとして数える
      if (othersOnly && f.member) continue;
      const actual = f.x < W / 2 ? -1 : 1;
      const plan = (f.member ? school : f).crossTo;
      const nearLine = Math.abs(f.x - W / 2) < (f.member ? 10 : 4);   // 中央線ぎわは両側に数える
      const home = f.member && (school.xHome < 0.5 ? -1 : 1) === side;   // 群れは行き先（住まい）の側にも数える
      if (actual === side || plan === side || nearLine || home) n++;
    }
    return { n, total };
  }
  // plannedCounts は底の魚の行き先選びに使う
  function plannedCounts() {
    return { left: sideLoad(-1, false).n, right: sideLoad(1, false).n };
  }
  function canEnter(side, n) {
    const l = sideLoad(side, false);
    return l.n + n <= Math.floor(l.total * 0.7);
  }
  // 1 匹が画面外へ出ても、反対側が 7 割を超えないか
  function canLeave(f) {
    const other = (f.x < W / 2 ? -1 : 1) * -1;
    const l = sideLoad(other, false);
    return l.n <= Math.floor((l.total - 1) * 0.7);
  }
  function canEnterSchool(side) {
    const l = sideLoad(side, true);
    return l.n + SPECIES.tetra.n <= Math.floor(l.total * 0.7);
  }
  // 群れが渡りたい側にいる魚のうち、中央にいちばん近い 1 匹の範囲を反対側へ移す
  function callAcross(side) {
    let best = null, bd = 1e9;
    for (const f of soloList()) {
      if (f.state !== 'swim' || f.exiting || f.crossTo) continue;
      const onSide = (f.x < W / 2 ? -1 : 1) === side;
      const homeSide = (f.xHome < 0.5 ? -1 : 1) === side;
      if (!onSide || !homeSide) continue;
      const d = Math.abs(f.x - W / 2);
      if (d < bd) { bd = d; best = f; }
    }
    if (best) best.xHome = 1 - best.xHome;
  }

  // 一般の泳ぎ（中心が x, y）
  function updateSwimmer(f, dt) {
    const sp = SPECIES[f.sp];
    if (f.state === 'away') {
      f.awayT -= dt;
      if (f.awayT <= 0) reenter(f);
      return;
    }
    f.sPh = wrapPhase(f.sPh + f.sW * dt);
    f.yPh1 = wrapPhase(f.yPh1 + f.yW1 * dt);
    f.yPh2 = wrapPhase(f.yPh2 + f.yW2 * dt);
    const spd = sp.speed * f.speedMul * (0.8 + 0.2 * Math.sin(f.sPh));

    // よく泳ぐ範囲の端で、ゆるく折り返す（画面の端に接する範囲なら、まれに画面外へ）
    const margin = f.w * 0.5 + 14;
    let lo = Math.max(margin, (f.xHome - f.xRange) * W);
    let hi = Math.min(W - margin, (f.xHome + f.xRange) * W);
    const homeSide = f.xHome < 0.5 ? -1 : 1;
    if (f === school) {
      // 群れの範囲は、全員が中央線のこちら側に収まるように
      if (homeSide < 0) hi = Math.min(hi, W / 2 - 44); else lo = Math.max(lo, W / 2 + 44);
    }
    // 画面の中央線を越えるのは、越えた先が混みすぎないときだけ
    let spdK = 1;
    if (f === school) {
      // 群れ：渡れないときは中央で待ち、そのあいだに向こう側の魚を 1 匹ずつこちらへ呼ぶ
      const lead = (W / 2 - f.x) * f.dir;
      const moving = (f.x < W / 2 ? -1 : 1) !== homeSide && f.dir === homeSide;   // 反対側へ引っ越し中
      if (f.crossTo !== 0 && (f.x - 38 * f.crossTo - W / 2) * f.crossTo > 0) f.crossTo = 0;
      if (moving && !f.turning && f.crossTo === 0 && lead < 40) {
        if (canEnterSchool(f.dir)) { f.crossTo = f.dir; f.hover = 0; }
        else if (f.hover <= 0) { f.hover = 40; f.callT = 0; }
      }
      if (f.hover > 0 && canEnterSchool(f.dir)) { f.crossTo = f.dir; f.hover = 0; }
      if (f.hover > 0) {
        f.hover -= dt;
        f.callT -= dt;
        if (f.callT <= 0) { f.callT = 4; callAcross(f.dir); }
        // 待つ位置：向こう側に空きがある分だけ、群れの先頭をはみ出させる
        const room = Math.max(0, Math.floor(sideLoad(f.dir, false).total * 0.7) - sideLoad(f.dir, true).n);
        const fronts = [];
        for (const m of fishes) if (m.member) fronts.push(m.ox * f.dir);
        fronts.sort((a, b) => b - a);
        const waitLead = Math.max(4, room >= fronts.length ? 8 : fronts[room] + 14);   // 中心は中央線を越えない
        spdK = Math.max(-0.25, Math.min(1, (lead - waitLead) / 30));
        if (f.hover <= 0) {
          // 戻っても元の側が混みすぎないなら、あきらめて出直す。混むならもう少し待つ
          if (sideLoad(-f.dir, true).n + SPECIES.tetra.n <= Math.floor(sideLoad(-f.dir, false).total * 0.7)) {
            f.xHome = 1 - f.xHome; f.sideT = rr(60, 120);
          } else f.hover = 10;
        }
      }
    } else if (!f.turning && !f.exiting) {
      if (f.crossTo !== 0 && (f.x - W / 2) * f.crossTo > 0) f.crossTo = 0;   // 渡りきった
      const lead = (W / 2 - f.x) * f.dir;
      if (f.crossTo === 0 && lead > 0 && lead < 18) {
        if (canEnter(f.dir, 1)) f.crossTo = f.dir;
        else startTurn(f);   // 手前でゆるく折り返す
      }
    }
    if (!f.turning && !f.exiting && !(f.hover > 0)) {
      const out = f.dir > 0 ? f.x > hi : f.x < lo;
      if (out) {
        const atEdge = f.dir > 0 ? hi >= W - margin - 0.5 : lo <= margin + 0.5;
        if (atEdge && exitGrace <= 0 && awayCount() < MAX_AWAY && canLeave(f) && rnd() < sp.exitP) f.exiting = true;
        else startTurn(f);
      } else if (sp.turnRate > 0 && f.x > lo + 12 && f.x < hi - 12 && rnd() < sp.turnRate * dt) {
        startTurn(f);   // ときどき途中で向きを変える
      }
    }

    const desVx = f.dir * spd * spdK;
    const acc = f.turning ? 0.55 : 0.8;
    f.vx += (desVx - f.vx) * Math.min(1, acc * dt);

    // 上下
    f.yHomeT -= dt;
    if (f.yHomeT <= 0) { f.yHome = rnd(); f.yHomeT = rr(25, 70); }
    const homeY = bandY(sp, f.yHome);
    let desVy = (homeY - f.y) * 0.06 + Math.sin(f.yPh1) * 1.2 + Math.sin(f.yPh2) * 0.5;
    desVy = Math.max(-2.5, Math.min(2.5, desVy));
    f.vy += (desVy - f.vy) * Math.min(1, 0.7 * dt);

    f.x += f.vx * dt;
    f.y += f.vy * dt;
    const yMin = 8 + f.h / 2, yMax = sandBase - f.h / 2 - 2;
    if (f.y < yMin) { f.y = yMin; if (f.vy < 0) f.vy = 0; }
    if (f.y > yMax) { f.y = yMax; if (f.vy > 0) f.vy = 0; }

    // 向きの見た目：速度に合わせて横に縮んで裏返る
    if (f.turning) {
      const k = f.vx / (0.45 * spd);
      let s = Math.max(-1, Math.min(1, k));
      if (Math.abs(s) < 0.15) s = s < 0 ? -0.15 : 0.15;
      f.sx = s;
      if (Math.sign(f.vx) === f.dir && Math.abs(f.vx) >= 0.45 * spd) { f.turning = false; f.sx = f.dir; }
    } else {
      f.sx = f.dir;
    }
    f.face = f.sx < 0 ? -1 : 1;

    f.tailPh += dt * (1.6 + Math.abs(f.vx) * 0.35);
    if (f.tailPh >= 4) f.tailPh -= 4 * Math.floor(f.tailPh / 4);

    if (f.exiting && offscreen(f)) {
      f.state = 'away';
      f.awayT = rr(4, 10);
      f.exiting = false;
      f.turning = false;
    }
  }

  // 戻るときは、魚の少ない側から入る
  function reenter(f) {
    const sp = SPECIES[f.sp];
    const c = sideCounts();
    const side = c.left === c.right ? (rnd() < 0.5 ? -1 : 1) : (c.left < c.right ? -1 : 1); // -1: 左から入る
    f.dir = -side;
    f.sx = f.dir; f.face = f.dir;
    f.turning = false;
    f.x = side < 0 ? -(f.w / 2 + 2) : W + f.w / 2 + 2;
    f.xHome = side < 0 ? rr(0.15, 0.4) : rr(0.6, 0.85);
    f.vx = f.dir * sp.speed * f.speedMul;
    f.vy = 0;
    f.exiting = false;
    f.state = 'swim';
    f.yHome = rnd(); f.y = bandY(sp, f.yHome);
  }

  function sideCounts() {
    let left = 0, right = 0;
    for (const f of fishes) {
      if (f.state === 'away' || offscreen(f)) continue;
      if (f.x < W / 2) left++; else right++;
    }
    return { left, right };
  }

  // 左右どちらかに寄りすぎたら、混んでいる側の魚の「よく泳ぐ範囲」を反対側へ移す
  function balance(dt) {
    if (!(school.hover > 0) && school.crossTo === 0) school.sideT -= dt;   // 待ち・渡りの最中は数えない
    if (school.sideT <= 0) { school.sideT = rr(120, 240); school.xHome = 1 - school.xHome; }
    for (const f of soloList()) {
      f.swapT -= dt;
      if (f.swapT <= 0) {
        f.swapT = rr(60, 180);
        const list = soloList();
        const o = list[Math.floor(rnd() * list.length)];
        if (o !== f) { const t = f.xHome; f.xHome = o.xHome; o.xHome = t; }
      }
    }
  }

  // 群れのメンバー
  function updateMember(m, dt, members) {
    const c = school;
    m.oPh = wrapPhase(m.oPh + m.oW * dt);
    m.oPh2 = wrapPhase(m.oPh2 + m.oW2 * dt);
    // 個体ごとに小さく前後・上下へずれる
    const tx = c.x + m.ox + Math.sin(m.oPh) * 3.5;
    const ty = c.y + m.oy + Math.sin(m.oPh2) * 2;
    let ax = (tx - m.x) * 0.35 - m.vx * 0.9 + c.vx * 0.9;
    let ay = (ty - m.y) * 0.35 - m.vy * 1.0 + c.vy * 0.5;
    // 近すぎる仲間から離れる（体長ほどの間隔）
    for (const o of members) {
      if (o === m) continue;
      const nx = (m.x - o.x) / 15, ny = (m.y - o.y) / 8;
      const q = Math.sqrt(nx * nx + ny * ny);
      if (q < 1 && q > 0.001) {
        ax += nx / q * (1 - q) * 10;
        ay += ny / q * (1 - q) * 6;
      }
    }
    m.vx += ax * dt;
    m.vy += ay * dt;
    const maxV = SPECIES.tetra.speed * 1.8;
    const v = Math.hypot(m.vx, m.vy);
    if (v > maxV) { m.vx *= maxV / v; m.vy *= maxV / v; }
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    const yMin = 8 + m.h / 2, yMax = sandBase - m.h / 2 - 2;
    if (m.y < yMin) m.y = yMin;
    if (m.y > yMax) m.y = yMax;

    // 向き：しばらく逆向きに進んだら裏返る（ちらつき防止）
    if (m.turnT > 0) {
      m.turnT -= dt / 0.7;
      if (m.turnT <= 0) { m.turnT = 0; m.sx = m.dir; }
      else {
        const s = -m.dir * Math.cos(Math.PI * (1 - m.turnT));
        m.sx = Math.abs(s) < 0.15 ? (s < 0 ? -0.15 : 0.15) : s;
      }
    } else {
      const want = m.vx > 0 ? 1 : -1;
      if (want !== m.dir && Math.abs(m.vx) > 1.2) {
        m.flipHold += dt;
        if (m.flipHold > 0.5) { m.flipHold = 0; m.dir = want; m.turnT = 1; }
      } else {
        m.flipHold = Math.max(0, m.flipHold - dt);
      }
      if (m.turnT <= 0) m.sx = m.dir;
    }
    m.face = m.sx < 0 ? -1 : 1;
    m.tailPh += dt * (2.2 + Math.abs(m.vx) * 0.4);
    if (m.tailPh >= 4) m.tailPh -= 4 * Math.floor(m.tailPh / 4);
  }

  // 底の魚：開けた砂の上の目的地まで歩き、しばらく休む
  function updateBottom(f, dt) {
    const sp = SPECIES[f.sp];
    if (f.turnT > 0) {
      f.turnT -= dt / 0.9;
      if (f.turnT <= 0) { f.turnT = 0; f.sx = f.dir; }
      else f.sx = f.dir * Math.cos(Math.PI * f.turnT);
    }
    const dx = f.tx - f.x;
    if (f.rest > 0) {
      f.rest -= dt;
      f.vx += (0 - f.vx) * Math.min(1, 1.5 * dt);
      if (f.rest <= 0) f.tx = pickCoryTarget(f);
    } else if (Math.abs(dx) < 1.5) {
      f.rest = rr(6, 16);
    } else {
      const want = dx > 0 ? 1 : -1;
      if (want !== f.dir && f.turnT === 0) { f.dir = want; f.turnT = 1; }
      if (f.turnT > 0) {
        f.vx += (0 - f.vx) * Math.min(1, 1.5 * dt);
      } else {
        const des = f.dir * sp.speed * f.speedMul * Math.min(1, Math.abs(dx) / 6 + 0.25);
        f.vx += (des - f.vx) * Math.min(1, 1.2 * dt);
      }
    }
    f.x += f.vx * dt;
    f.x = Math.max(f.w / 2, Math.min(W - f.w / 2, f.x));
    const ty = coryY(f);
    f.y += (ty - f.y) * Math.min(1, 2 * dt);
    if (f.turnT === 0) f.sx = f.dir;
    f.face = f.sx < 0 ? -1 : 1;
    f.tailPh += dt * (0.8 + Math.abs(f.vx) * 0.6);
    if (f.tailPh >= 4) f.tailPh -= 4 * Math.floor(f.tailPh / 4);
  }

  // ------------------------------------------------------------------
  // 泡と粒
  // ------------------------------------------------------------------
  const bubbles = [];
  let particles = [];

  function updateBubbles(dt) {
    for (const s of bubbleSources) {
      s.timer -= dt;
      if (s.timer <= 0) {
        s.on = !s.on;
        s.timer = s.on ? rr(3, 7) : rr(16, 40);
        s.rate = rr(0.35, 0.75);
      }
      if (s.on) {
        s.emit -= dt;
        if (s.emit <= 0) {
          s.emit = s.rate * rr(0.6, 1.4);
          if (bubbles.length < MAX_BUBBLES) {
            bubbles.push({ x: s.x + rr(-0.6, 0.6), y: s.y, vy: -rr(5, 8), size: 0, maxSize: rnd() < 0.15 ? 2 : 1, ph: rnd() * TAU, wob: rr(0.3, 0.9), grow: rr(0.35, 0.6) });
          }
        }
      }
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.vy = Math.max(-18, b.vy - 3 * dt);
      b.y += b.vy * dt;
      b.ph = wrapPhase(b.ph + 3 * dt);
      b.x += Math.sin(b.ph) * b.wob * dt * 3;
      const depthFrac = b.y / Math.max(1, sandBase);
      if (b.size < b.maxSize && depthFrac < b.grow) { b.size++; b.grow *= 0.45; }
      if (b.y < 6 || b.x < -4 || b.x > W + 4 || !isFinite(b.y)) {
        bubbles[i] = bubbles[bubbles.length - 1];
        bubbles.pop();
      }
    }
  }

  function initParticles() {
    const n = Math.max(40, Math.min(120, Math.round(W * H / 700)));
    particles = [];
    for (let i = 0; i < n; i++) {
      particles.push({
        x: rnd() * W, y: rr(8, sandBase), front: rnd() < 0.3,
        ph: rnd() * TAU, w: rr(0.1, 0.3), ph2: rnd() * TAU, w2: rr(0.05, 0.15),
        drift: rr(0.3, 1.2), tw: rnd() * TAU
      });
    }
  }

  let currentPh = 0;
  function updateParticles(dt) {
    const cur = Math.sin(currentPh) * 0.8;
    for (const p of particles) {
      p.ph = wrapPhase(p.ph + p.w * dt);
      p.ph2 = wrapPhase(p.ph2 + p.w2 * dt);
      p.tw = wrapPhase(p.tw + 0.6 * dt);
      p.x += (cur * p.drift + Math.sin(p.ph) * 0.7) * dt;
      p.y += (Math.sin(p.ph2) * 0.5 + 0.12) * dt;
      if (p.x < -2) p.x += W + 4;
      if (p.x > W + 2) p.x -= W + 4;
      if (p.y > sandBase + 2) p.y = 8;
      if (p.y < 8) p.y = sandBase;
      if (!isFinite(p.x) || !isFinite(p.y)) { p.x = rnd() * W; p.y = rr(8, sandBase); }
    }
  }

  // ------------------------------------------------------------------
  // 時間
  // ------------------------------------------------------------------
  let dayPhase = 0.04;   // 0..1
  let surfPh1 = 0, surfPh2 = 0, causPh1 = 0, causPh2 = 0, causPh3 = 0;
  let simSeconds = 0;
  let exitGrace = 120;   // 開いてしばらくは画面外へ抜けない

  function step(dt) {
    if (exitGrace > 0) exitGrace -= dt;
    dayPhase += dt / DAY_PERIOD;
    if (dayPhase >= 1) dayPhase -= Math.floor(dayPhase);
    simSeconds += dt;
    currentPh = wrapPhase(currentPh + 0.021 * dt);
    surfPh1 = wrapPhase(surfPh1 + 0.6 * dt);
    surfPh2 = wrapPhase(surfPh2 + 0.37 * dt);
    causPh1 = wrapPhase(causPh1 + 0.5 * dt);
    causPh2 = wrapPhase(causPh2 + 0.33 * dt);
    causPh3 = wrapPhase(causPh3 + 0.21 * dt);

    for (const s of shafts) {
      s.ph = wrapPhase(s.ph + s.w * dt);
      s.ph2 = wrapPhase(s.ph2 + s.w2 * dt);
    }
    for (const p of plants) {
      const list = p.blades || p.stems;
      for (const b of list) b.ph = wrapPhase(b.ph + b.w * dt);
    }
    for (const b of farBlades) b.ph = wrapPhase(b.ph + b.w * dt);

    // 魚
    updateSwimmer(school, dt);
    const members = [];
    for (const f of fishes) if (f.member) members.push(f);
    for (const f of fishes) {
      if (f.member) updateMember(f, dt, members);
      else if (SPECIES[f.sp].bottom) updateBottom(f, dt);
      else updateSwimmer(f, dt);
      if (!isFinite(f.x) || !isFinite(f.y) || !isFinite(f.vx) || !isFinite(f.vy)) {
        f.x = -100; f.y = sandBase * 0.5; f.vx = 0; f.vy = 0; f.state = 'away'; f.awayT = 5;
      }
    }
    // 泳ぐ魚どうし（群れを含む）が重なりすぎないよう、上下にそっと離す
    const solo = [school];
    for (const f of fishes) if (!f.member && !SPECIES[f.sp].bottom) solo.push(f);
    for (let i = 0; i < solo.length; i++) {
      const a = solo[i];
      if (a.state === 'away') continue;
      for (let j = i + 1; j < solo.length; j++) {
        const b = solo[j];
        if (b.state === 'away') continue;
        const ox = (a.w + b.w) * 0.5 - Math.abs(a.x - b.x);
        const oy = (a.h + b.h) * 0.55 - Math.abs(a.y - b.y);
        if (ox > 0 && oy > 0) {
          const s = a.y < b.y ? -1 : 1;
          const push = Math.min(oy, 6) * 0.6 * dt;
          a.y += s * push; b.y -= s * push;
          a.yHome = Math.max(0, Math.min(1, a.yHome + s * 0.08 * dt));
          b.yHome = Math.max(0, Math.min(1, b.yHome - s * 0.08 * dt));
        }
      }
    }
    balance(dt);
    updateBubbles(dt);
    updateParticles(dt);
  }

  // ------------------------------------------------------------------
  // 描画
  // ------------------------------------------------------------------
  function drawRibbon(p, b, sway) {
    const h = Math.max(2, b.h);
    let prevX = null;
    for (let j = 0; j < h; j++) {
      const t = j / h;
      const x = Math.round(p.x + b.dx + b.lean * j + sway * t * t + b.bend * t * t * h * 0.15);
      const y = p.base - j;
      if (y < 0) break;
      let body, edge;
      if (p.tone === 0) { body = t < 0.35 ? 17 : 18; edge = t > 0.5 ? 19 : 18; }
      else if (p.tone === 1) { body = 17; edge = t > 0.55 ? 18 : 17; }
      else { body = t < 0.4 ? 18 : 19; edge = t > 0.5 ? 20 : 19; }
      const plot = p.layer === 'back' ? pxBehind : px;
      const wide = t < 0.75 || p.tone === 1;
      plot(x, y, body);
      if (wide) plot(x + 1, y, edge);
      if (p.tone === 1 && t < 0.85) plot(x - 1, y, body);
      // 隙間をつなぐ
      if (prevX !== null && Math.abs(x - prevX) > 1) plot((x + prevX) >> 1, y, body);
      prevX = x;
    }
  }

  function drawStem(p, s, sway) {
    const h = Math.max(4, s.h);
    const stemC = p.red ? 22 : 18;
    const leafA = p.red ? 23 : 19;
    const leafB = p.red ? 24 : 20;
    const leafD = p.red ? 21 : 18;
    for (let j = 0; j < h; j++) {
      const t = j / h;
      const x = Math.round(p.x + s.dx + s.lean * j + sway * t * t);
      const y = p.base - j;
      px(x, y, stemC);
      if (((j + s.leafPh) % 4) === 0 && j > 3) {
        const side = (((j + s.leafPh) >> 2) & 1) ? 1 : -1;
        const tip = t > 0.82;
        // 葉：斜め上に伸びる 3〜4px
        px(x + side, y, leafD);
        px(x + side * 2, y, leafA);
        px(x + side * 3, y - 1, tip ? leafB : leafA);
        if (!tip) px(x + side * 2, y - 1, leafB);
        // 反対側にも小さく
        px(x - side, y - 1, leafA);
        px(x - side * 2, y - 2, leafD);
      }
    }
    // 先端
    const tx = Math.round(p.x + s.dx + s.lean * h + sway);
    px(tx, p.base - h, leafB);
    px(tx - 1, p.base - h + 1, leafA);
    px(tx + 1, p.base - h + 1, leafA);
  }

  function drawLeaves(cl, swayBase) {
    // アヌビアス風の丸い葉（静かに揺れる）
    for (let k = 0; k < cl.n; k++) {
      const ang = -0.9 + k * (1.8 / Math.max(1, cl.n - 1));
      const sw = Math.round(Math.sin(swayBase + k) * 0.7);
      const lx = Math.round(cl.x + Math.sin(ang) * 6) + sw;
      const ly = Math.round(cl.y - Math.cos(ang) * 4);
      const dir = Math.sin(ang) >= 0 ? 1 : -1;
      // 6x3 の葉
      const shape = ['.ggg..', 'gGGGg.', '.gggg.'];
      for (let yy = 0; yy < 3; yy++) {
        for (let xx = 0; xx < 6; xx++) {
          const ch = shape[yy][dir > 0 ? xx : 5 - xx];
          if (ch === '.') continue;
          px(lx + xx - 3, ly + yy - 1, ch === 'G' ? 19 : (yy === 0 ? 18 : 17));
        }
      }
      // 茎
      px(lx - dir * 3, ly + 1, 17);
      px(Math.round((lx + cl.x) / 2), Math.round((ly + cl.y) / 2) + 1, 17);
    }
  }

  function render() {
    updatePalette(dayPhase);
    buf.set(stat);

    // 遠景の草（背景を一段暗く）
    for (const b of farBlades) {
      const sway = Math.sin(b.ph) * b.amp;
      for (let j = 0; j < b.h; j++) {
        const t = j / b.h;
        const x = Math.round(b.x + b.lean * j + (sway + b.bend) * t * t);
        const y = Math.round(b.base - j);
        if (x < 0 || x >= W || y < 0 || y >= H) continue;
        const i = y * W + x;
        if (waterMask[i]) buf[i] = DARKEN[stat[i]];
      }
    }

    const swayGlobal = Math.sin(currentPh) * 1.5;
    // 奥の草
    for (const p of plants) {
      if (p.layer !== 'back') continue;
      for (const b of p.blades) drawRibbon(p, b, Math.sin(b.ph) * b.amp + swayGlobal);
    }

    // 水面
    for (let x = 0; x < W; x++) {
      const s = 4 + Math.round(1.2 * Math.sin(x * 0.07 + surfPh1) + 0.8 * Math.sin(x * 0.17 - surfPh2));
      for (let y = 0; y < s; y++) buf[y * W + x] = (bayer(x, y) < 0.5 ? 5 : 6);
      if (Math.sin(x * 0.31 + surfPh1 * 2) > -0.6) buf[s * W + x] = 7;
      else buf[s * W + x] = 6;
      if (bayer(x, s + 1) < 0.5) buf[(s + 1) * W + x] = LIGHTEN[buf[(s + 1) * W + x]];
    }

    // 砂のコースティクス
    const cs = light.caus;
    if (cs > 0.02) {
      for (let x = 0; x < W; x++) {
        const top = sandTop[x];
        for (let y = top; y < Math.min(H, top + 9); y++) {
          const i = y * W + x;
          const c = buf[i];
          if (c < 10 || c > 12) continue;
          const v = Math.sin(x * 0.33 + causPh1 + y * 0.4) + Math.sin(x * 0.12 - causPh2) + Math.sin((x - y * 2) * 0.21 + causPh3);
          const k = (v - 1.1) * cs * (1 - (y - top) / 9);
          if (k > bayer(x, y)) buf[i] = LIGHTEN[c];
        }
      }
    }

    // 光の筋
    const st = light.shaft;
    for (const s of shafts) {
      const sway = Math.sin(s.ph) * s.amp;
      const breathe = 0.75 + 0.25 * Math.sin(s.ph2);
      for (let y = 0; y < sandBase + 4 && y < H; y++) {
        const cxp = s.x + sway + s.slope * y;
        const half = (s.w0 + y * 0.09) * 0.5 * (0.85 + 0.15 * breathe);
        const fade = Math.pow(Math.max(0, 1 - y / (sandBase * 1.08)), 1.2);
        const strength = st * breathe * fade;
        if (strength <= 0.01) continue;
        const xa = Math.max(0, Math.floor(cxp - half)), xb = Math.min(W - 1, Math.ceil(cxp + half));
        for (let x = xa; x <= xb; x++) {
          const e = 1 - Math.abs(x - cxp) / half;
          if (e <= 0) continue;
          if (strength * Math.min(1, e * 2.6) > bayer(x, y)) {
            const i = y * W + x;
            buf[i] = LIGHTEN[buf[i]];
          }
        }
      }
    }

    // 奥の粒
    for (const p of particles) {
      if (p.front) continue;
      const x = Math.round(p.x), y = Math.round(p.y);
      if (Math.sin(p.tw) > -0.3) remap(x, y, LIGHTEN);
    }

    // 中景の草・流木の葉
    for (const cl of leafClusters) drawLeaves(cl, currentPh * 3);
    for (const p of plants) {
      if (p.layer !== 'mid') continue;
      for (const s of p.stems) drawStem(p, s, Math.sin(s.ph) * s.amp + swayGlobal);
    }

    // 泡（魚より奥）
    for (const b of bubbles) {
      const x = Math.round(b.x), y = Math.round(b.y);
      if (b.size === 0) { px(x, y, 7); }
      else if (b.size === 1) { px(x, y, 8); px(x + 1, y, 7); px(x, y + 1, 7); remap(x + 1, y + 1, LIGHTEN); }
      else {
        // 小さな輪（3x3）
        px(x, y - 1, 7); px(x - 1, y, 7); px(x + 1, y, 7); px(x, y + 1, 7);
        remap(x, y, LIGHTEN);
      }
    }

    // 泳ぐ魚（大きい魚を奥に）
    const drawFish = f => {
      const frames = FRAMES[SPECIES[f.sp].frame];
      const fr = frames[TAIL_SEQ[Math.floor(f.tailPh) & 3]];
      drawSprite(fr, f.x, f.y, f.sx);
    };
    const order = ['angel', 'gourami', 'tetra', 'platy'];
    for (const key of order) {
      for (const f of fishes) {
        if (f.sp !== key || f.state === 'away') continue;
        drawFish(f);
      }
    }

    // 手前の草
    for (const p of plants) {
      if (p.layer !== 'front') continue;
      for (const b of p.blades) drawRibbon(p, b, Math.sin(b.ph) * b.amp + swayGlobal);
    }

    // 底の魚（底の造形より手前）
    for (const f of fishes) if (SPECIES[f.sp].bottom) drawFish(f);

    // 手前の粒
    for (const p of particles) {
      if (!p.front) continue;
      const x = Math.round(p.x), y = Math.round(p.y);
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      if (Math.sin(p.tw) > 0) px(x, y, 7); else remap(x, y, LIGHTEN);
    }

    // 周辺減光
    for (let i = 0, n = W * H; i < n; i++) {
      const v = vign[i];
      if (v === 0) continue;
      let c = buf[i];
      c = DARKEN[c];
      if (v > 1) c = DARKEN[c];
      buf[i] = c;
    }

    for (let i = 0, n = W * H; i < n; i++) img32[i] = pal32[buf[i]];
    ctx.putImageData(imgData, 0, 0);
  }

  // ------------------------------------------------------------------
  // サイズ
  // ------------------------------------------------------------------
  let lastSize = '';
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
    const pw = Math.round(vw * dpr), ph = Math.round(vh * dpr);
    let s = Math.max(1, Math.round(Math.min(pw, ph) / TARGET_SHORT));
    let nw = Math.ceil(pw / s), nh = Math.ceil(ph / s);
    while ((nw * nh > MAX_AREA || Math.max(nw, nh) > MAX_LONG) && s < 64) {
      s++;
      nw = Math.ceil(pw / s); nh = Math.ceil(ph / s);
    }
    const key = nw + 'x' + nh + '@' + s + '/' + dpr;
    const cssW = nw * s / dpr, cssH = nh * s / dpr;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.style.left = Math.floor((vw - cssW) / 2) + 'px';
    canvas.style.top = Math.floor((vh - cssH) / 2) + 'px';
    if (key === lastSize) return;
    lastSize = key;

    const oldW = W, oldH = H;
    W = nw; H = nh;
    canvas.width = W; canvas.height = H;
    ctx.imageSmoothingEnabled = false;
    buf = new Uint8Array(W * H);
    stat = new Uint8Array(W * H);
    waterMask = new Uint8Array(W * H);
    vign = new Uint8Array(W * H);
    sandTop = new Int16Array(W);
    imgData = ctx.createImageData(W, H);
    img32 = new Uint32Array(imgData.data.buffer);
    buildScene();

    if (fishes.length === 0) {
      initFish();
    } else {
      const kx = W / oldW, ky = H / oldH;
      const all = fishes.concat([school]);
      for (const f of all) { f.x *= kx; f.y *= ky; f.tx *= kx; }
      for (const f of fishes) if (SPECIES[f.sp].bottom) f.y = coryY(f);
    }
    bubbles.length = 0;
    initParticles();
  }

  // ------------------------------------------------------------------
  // ループ
  // ------------------------------------------------------------------
  let last = -1;
  function frame(now) {
    if (last < 0) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > MAX_DT) dt = MAX_DT;
    let sim = dt * SPEED;
    let n = Math.ceil(sim / SUB_STEP);
    if (n > MAX_SUBSTEPS) n = MAX_SUBSTEPS;
    if (n > 0) {
      const h = sim / n;
      for (let i = 0; i < n; i++) step(h);
    }
    render();
    requestAnimationFrame(frame);
  }

  window.__stats = function () {
    const c = sideCounts();
    return {
      fish: fishes.length,
      visible: c.left + c.right,
      left: c.left,
      right: c.right,
      bubbles: bubbles.length,
      particles: particles.length,
      plants: plants.length,
      dayPhase: Math.round(dayPhase * 1000) / 1000,
      simSeconds: Math.round(simSeconds),
      buffer: W + 'x' + H
    };
  };

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  resize();
  // 起動直後から自然に見えるよう、少しだけ先に進めておく
  for (let i = 0; i < 90; i++) step(SUB_STEP);
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
